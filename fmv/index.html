<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mag 7 Fair Value — Pear Digitals</title>
<meta name="description" content="Fair market value analysis for the Magnificent 7 stocks, from Pear Digitals.">
<style>
  :root { --ink:#0f1f17; --muted:#4a5650; --bg:#f7f8f5; --card:#fff; --line:#e2e4e0; --green:#14532d; --accent:#00c805; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif; line-height:1.6; color:var(--ink); background:var(--bg); }
  a { color:var(--green); }
  .wrap { max-width:1040px; margin:0 auto; padding:0 24px; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:20px 0; }
  nav .brand { font-weight:700; letter-spacing:-.01em; color:var(--ink); text-decoration:none; font-size:1.05rem; }
  nav .links a { margin-left:22px; text-decoration:none; color:var(--muted); font-size:.95rem; }
  nav .links a:hover { color:var(--ink); }
  .hero { padding:40px 0 28px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .eyebrow { color:var(--green); font-weight:600; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; }
  h1 { font-size:clamp(2rem,5vw,3rem); line-height:1.1; letter-spacing:-.03em; margin:.2em 0 0; }
  .gh { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px; font-weight:600; font-size:.95rem; text-decoration:none; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .gh:hover { background:var(--green); color:#fff; border-color:var(--green); }
  .gh svg { width:16px; height:16px; fill:currentColor; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:56px; }
  #loading { color:var(--muted); padding:40px 0; text-align:center; }
  #err { color:#b00; padding:40px 0; text-align:center; }
  .zb { display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; color:#fff; }
  #px { font-size:clamp(1.9rem,7vw,2.4rem); font-weight:700; letter-spacing:-.02em; margin:4px 0 0; line-height:1.2; }
  #tickerrow { display:flex; align-items:center; gap:10px; margin:8px 0; }
  #chg { font-size:.95rem; margin-bottom:6px; }
  select { font:inherit; font-size:.95rem; padding:7px 12px; margin:4px 0; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); }
  #tickerrow, .ranges { max-width:100%; }
  .ranges { display:flex; flex-wrap:wrap; }
  .ranges button { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 14px; margin:0 6px 10px 0; font:inherit; font-size:.85rem; cursor:pointer; color:var(--ink); }
  .ranges button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .legend { display:flex; gap:16px; font-size:.82rem; color:var(--muted); margin:4px 0 8px; flex-wrap:wrap; }
  .sw { display:inline-block; width:22px; height:0; border-top:3px solid; border-radius:2px; margin-right:6px; vertical-align:middle; }
  #chart { position:relative; width:100%; }
  #chart svg { width:100%; height:auto; display:block; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  #cmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.75); color:var(--muted); font-size:.95rem; border-radius:12px; }
  #cmsg[hidden] { display:none; }
  .bx { display:inline-block; width:22px; height:10px; border-radius:3px; margin-right:6px; vertical-align:middle; background:rgba(224,168,0,.28); border-top:2px dashed #E0A800; }
  #foot { margin:10px 0 0; }
  #tip { position:absolute; display:none; background:var(--ink); color:#fff; font-size:11px; padding:6px 9px; border-radius:6px; pointer-events:none; white-space:nowrap; z-index:5; }
  footer { border-top:1px solid var(--line); padding:32px 0 48px; color:var(--muted); font-size:.9rem; }
  footer .row { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  footer a { margin-right:18px; }
  .note { font-size:.85rem; color:var(--muted); }
  @media (max-width:760px){ .ranges button{padding:6px 11px;margin-right:4px} .wrap{padding:0 16px} .panel{padding:14px 12px; border-radius:14px; margin-bottom:40px} .legend{gap:10px} .gh{padding:8px 16px} .links a:not(:nth-last-child(-n+2)){display:none} }
</style></head><body>
<div class="wrap">
  <nav>
    <a class="brand" href="/">Pear Digitals</a>
    <div class="links"><a href="/#mission">Mission</a><a href="/#options-ledger">Options Ledger</a><a href="https://pearinvestments.substack.com/" target="_blank" rel="noopener">Blog</a><a href="/#contact">Contact</a></div>
  </nav>
  <header class="hero">
    <div>
      <div class="eyebrow">FMV analysis</div>
      <h1>Mag 7 &middot; Fair Value</h1>
    </div>
    <a class="gh" href="https://github.com/Pear-Digitals/trading-prompts" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a>
  </header>
  <div class="panel">
    <div id="loading">Loading data&hellip;</div>
    <div id="err" hidden></div>
    <div id="app" hidden>
      <div id="px">&mdash;</div><div id="chg">&mdash;</div>
      <div id="tickerrow"><select id="sel"></select> <span id="zone"></span></div>
      <div class="ranges" id="ranges"></div>
      <div class="legend">
        <span><span class="sw" id="pxsw" style="border-color:#00C805"></span>stock price</span>
        <span><span class="bx"></span>FMV bear&ndash;bull range, dashed = base</span>
      </div>
      <div id="chart"><svg id="svg"></svg><div id="tip"></div><div id="cmsg" hidden>Loading&hellip;</div></div>
      <p class="note" id="foot"></p>
    </div>
  </div>
</div>
<footer>
  <div class="wrap">
    <div class="row">
      <div>&copy; 2026 Pear Digitals LLC. All rights reserved.</div>
      <div><a href="/">Home</a><a href="/options-ledger/privacy.html">Privacy Policy</a><a href="mailto:support@peardigitals.com">Contact</a></div>
    </div>
  </div>
</footer>
<script>
const SUPABASE_URL = "https://exzkanvrboytydrvwcwv.supabase.co/rest/v1";
const ANON_KEY = "sb_publishable_i1mvt6QvDAsxIbOidUvCmg_XrVaizj4";
const UP = "#00C805", DOWN = "#FF5000", GOLD = "#E0A800", INK = "#0f1f17";
const sel = document.getElementById('sel'), svg = document.getElementById('svg'),
      tip = document.getElementById('tip'), pxEl = document.getElementById('px'),
      chgEl = document.getElementById('chg'), zoneEl = document.getElementById('zone'),
      rangesEl = document.getElementById('ranges'), chartEl = document.getElementById('chart'),
      msgEl = document.getElementById('cmsg'), pxsw = document.getElementById('pxsw');

async function get(path) {
  const r = await fetch(SUPABASE_URL + path, {headers: {apikey: ANON_KEY}, cache: "no-store"});
  if (!r.ok) throw new Error("supabase " + r.status);
  return r.json();
}
const isWeekend = ds => { const w = new Date(ds + "T00:00:00").getDay(); return w === 0 || w === 6; };
function zoneOf(px, fm) {
  if (fm.sb_below && px < fm.sb_below) return ["Strong Buy", "#00C805"];
  if (fm.fb_hi && px <= fm.fb_hi) return ["Fair Buy", "#1a7f37"];
  const pct = (px / fm.weighted - 1) * 100;
  return [pct.toFixed(0) + "% above FMV", pct > 25 ? "#FF5000" : "#b7791f"];
}
let D = {}, LATEST = {}, FULL = {};
// [label, trading days shown, sample every N days] -- coarser sampling for longer ranges
const RANGES = [["1W",5,1],["1M",21,2],["3M",63,3],["6M",126,5],["1Y",252,5],["ALL",1e9,0]];
let curRange = "1W";

const priceRows = rows => rows.filter(r => !isWeekend(r.date)).map(r => [r.date, r.c]);

// Load the full price history for one ticker in the background.
function loadFull(t) {
  if (!FULL[t]) FULL[t] = get(`/prices_public?select=symbol,date,c&symbol=eq.${t}&order=date&limit=1000`)
    .then(rows => { D[t].p = priceRows(rows); D[t].full = true; });
  return FULL[t];
}

async function init() {
  try {
    // First paint needs only the last ~week of prices plus the FMV vintages.
    const since = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
    const [vintages, week] = await Promise.all([
      get("/vintages_public?select=ticker,date,bear,base,bull,weighted,sb_below,fb_lo,fb_hi&order=ticker,date"),
      get(`/prices_public?select=symbol,date,c&date=gte.${since}&order=symbol,date&limit=1000`)
    ]);
    vintages.forEach(r => {
      if (isWeekend(r.date)) return;  // safety net: DB should never hold weekend rows
      (D[r.ticker] = D[r.ticker] || {v: [], p: []}).v.push([r.date, r.bear, r.base, r.bull, r]);
    });
    week.forEach(r => {
      if (isWeekend(r.date)) return;
      (D[r.symbol] = D[r.symbol] || {v: [], p: []}).p.push([r.date, r.c]);
    });
    Object.keys(D).forEach(t => {
      const J = D[t]; J.p = J.p.slice(-5);
      if (J.v.length && J.p.length) LATEST[t] = {fm: J.v[J.v.length-1][4], px: J.p[J.p.length-1][1], pxd: J.p[J.p.length-1][0]};
    });
  } catch (e) {
    document.getElementById('loading').hidden = true;
    const er = document.getElementById('err');
    er.hidden = false; er.textContent = "Could not load data: " + e.message;
    return;
  }
  document.getElementById('loading').hidden = true;
  document.getElementById('app').hidden = false;

  Object.keys(D).sort().forEach(t => {
    if (!LATEST[t]) return;
    const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  RANGES.forEach(([label]) => {
    const b = document.createElement('button'); b.textContent = label;
    if (label === curRange) b.classList.add('on');
    b.onclick = () => { curRange = label;
      [...rangesEl.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); };
    rangesEl.appendChild(b);
  });
  const dates = Object.values(LATEST).map(x => x.pxd).sort();
  document.getElementById('foot').textContent =
    "Data as of " + dates[dates.length-1] + " · Personal valuation estimates, not investment advice.";
  sel.addEventListener('change', draw);
  draw();

  // Everything else loads asynchronously, selected ticker first.
  const order = [sel.value, ...Object.keys(LATEST).filter(t => t !== sel.value)];
  order.forEach(t => loadFull(t).catch(() => {}));
  let lastW = chartEl.clientWidth, raf;
  new ResizeObserver(() => {
    if (chartEl.clientWidth === lastW) return;
    lastW = chartEl.clientWidth;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(draw);
  }).observe(chartEl);
}

// Smooth path through points using quadratic curves between midpoints.
function smooth(pts) {
  const f = q => q[0].toFixed(1) + "," + q[1].toFixed(1);
  if (pts.length < 3) return "M" + pts.map(f).join("L");
  let d = "M" + f(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) {
    const m = [(pts[i][0] + pts[i+1][0]) / 2, (pts[i][1] + pts[i+1][1]) / 2];
    d += "Q" + f(pts[i]) + " " + f(m);
  }
  return d + "L" + f(pts[pts.length-1]);
}

function draw() {
  const t = sel.value, J = D[t];
  const n = RANGES.find(r => r[0] === curRange)[1];
  if (n > 5 && !J.full) {   // longer ranges wait for the background load
    msgEl.hidden = false; msgEl.textContent = "Loading " + curRange + "…";
    loadFull(t).then(() => { if (sel.value === t) draw(); })
      .catch(() => { if (sel.value === t) msgEl.textContent = "Could not load history."; });
    return;
  }
  msgEl.hidden = true;
  const pFull = J.p.slice(-n);
  const step = RANGES.find(r => r[0] === curRange)[2] || Math.max(5, Math.ceil(pFull.length / 150));
  const p = pFull.filter((_, i) => (pFull.length - 1 - i) % step === 0);   // always keeps the latest day
  const W = Math.max(chartEl.clientWidth, 240), mobile = W < 560, H = mobile ? 260 : 380;
  const PL = 4, PR = mobile ? 46 : 58, PT = 14, PB = 10;
  const X = i => PL + i / Math.max(p.length - 1, 1) * (W - PL - PR);
  const idxForDate = d => { let bi = 0; p.forEach((r, i) => { if (r[0] <= d) bi = i; }); return bi; };
  const v0 = J.v.filter(r => r[0] >= p[0][0]);
  const v = v0.filter((r, i) => i === v0.length - 1 || idxForDate(r[0]) !== idxForDate(v0[i+1][0]));  // one vintage per plotted point
  const vals = p.map(r => r[1]);
  v.forEach(r => { if (r[1]) vals.push(r[1], r[3]); vals.push(r[2]); });
  const lo = Math.min(...vals) * 0.97, hi = Math.max(...vals) * 1.03;
  const Y = vv => PT + (1 - (vv - lo) / (hi - lo)) * (H - PT - PB);
  const p0 = pFull[0][1], p1 = p[p.length-1][1], pRet = p1 / p0 - 1;
  const lineCol = pRet >= 0 ? UP : DOWN;
  pxsw.style.borderColor = lineCol;

  let s = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">`
        + `<stop offset="0" stop-color="${lineCol}" stop-opacity=".18"/><stop offset=".7" stop-color="${lineCol}" stop-opacity="0"/></linearGradient></defs>`;
  for (let g = 0; g <= 4; g++) {
    const vv = lo + (hi - lo) * g / 4, y = Y(vv);
    s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e2e4e0" stroke-dasharray="2 5"/>`;
    s += `<text x="${W-PR+8}" y="${y+4}" font-size="11" fill="#7a847e">$${vv>=100?vv.toFixed(0):vv.toFixed(1)}</text>`;
  }
  // FMV band: bear-bull ribbon, dashed base line
  const vx = v.map(r => [X(idxForDate(r[0])), r]);
  let seg = [];
  const flush = () => {
    if (seg.length === 1) {
      const [x, r] = seg[0];
      s += `<line x1="${x}" y1="${Y(r[3])}" x2="${x}" y2="${Y(r[1])}" stroke="${GOLD}" stroke-width="8" stroke-linecap="round" opacity=".3"/>`;
    } else if (seg.length > 1) {
      const top = seg.map(([x, r]) => x.toFixed(1) + "," + Y(r[3]).toFixed(1));
      const bot = seg.slice().reverse().map(([x, r]) => x.toFixed(1) + "," + Y(r[1]).toFixed(1));
      s += `<polygon points="${top.concat(bot).join(' ')}" fill="${GOLD}" fill-opacity=".18" stroke="${GOLD}" stroke-opacity=".45" stroke-width="1" stroke-linejoin="round"/>`;
    }
    seg = [];
  };
  vx.forEach(([x, r]) => { if (r[1] && r[3]) seg.push([x, r]); else flush(); });
  flush();
  if (vx.length > 1)
    s += `<polyline fill="none" stroke="${GOLD}" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" points="${vx.map(([x, r]) => x.toFixed(1)+','+Y(r[2]).toFixed(1)).join(' ')}"/>`;
  if (vx.length <= 12)
    vx.forEach(([x, r]) => { s += `<circle cx="${x.toFixed(1)}" cy="${Y(r[2]).toFixed(1)}" r="4" fill="${GOLD}" stroke="#fff" stroke-width="1.5"/>`; });

  // price: gradient area + smooth coloured line + live dot
  const pts = p.map((r, i) => [X(i), Y(r[1])]);
  const line = smooth(pts);
  s += `<path d="${line}L${pts[pts.length-1][0].toFixed(1)},${H-PB}L${pts[0][0].toFixed(1)},${H-PB}Z" fill="url(#ga)"/>`;
  s += `<path d="${line}" fill="none" stroke="${lineCol}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  const [lx, ly] = pts[pts.length-1];
  s += `<circle cx="${lx}" cy="${ly}" r="4" fill="${lineCol}" opacity=".4"><animate attributeName="r" values="4;12" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0" dur="1.8s" repeatCount="indefinite"/></circle>`;
  s += `<circle cx="${lx}" cy="${ly}" r="4.5" fill="${lineCol}" stroke="#fff" stroke-width="2"/>`;
  s += `<g id="hv"></g>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.innerHTML = s;
  tip.style.display = "none";

  pxEl.textContent = "$" + p1.toFixed(2);
  const d = p1 - p0, pct = pRet * 100;
  chgEl.innerHTML = `<span style="color:${lineCol}">${d>=0?"+":""}${d.toFixed(2)} (${pct>=0?"+":""}${pct.toFixed(1)}%)</span> <span style="color:#7a847e">past ${curRange}</span>`;
  const {fm} = LATEST[t], [label, col] = zoneOf(p1, fm);
  zoneEl.innerHTML = `<span class="zb" style="background:${col};font-size:13px">${label}</span>`;

  // hover / touch crosshair
  const hv = svg.querySelector('#hv');
  const move = ev => {
    const rect = svg.getBoundingClientRect(), sx = rect.width / W;
    const mx = (ev.clientX - rect.left) / sx;
    let i = Math.round((mx - PL) / (W - PL - PR) * (p.length - 1));
    i = Math.max(0, Math.min(p.length - 1, i));
    const r = p[i], x = pts[i][0], y = pts[i][1];
    let fv = null; J.v.forEach(q => { if (q[0] <= r[0]) fv = q; });
    hv.innerHTML = `<line x1="${x}" y1="${PT}" x2="${x}" y2="${H-PB}" stroke="${INK}" stroke-opacity=".25"/>`
                 + `<circle cx="${x}" cy="${y}" r="5" fill="${lineCol}" stroke="#fff" stroke-width="2"/>`;
    tip.style.display = "block";
    tip.innerHTML = `${r[0]} &middot; <b>$${r[1].toFixed(2)}</b>` + (fv ? `<br>bear $${fv[1]?fv[1].toFixed(0):"—"} · base $${fv[2].toFixed(0)} · bull $${fv[3]?fv[3].toFixed(0):"—"}` : "");
    let tx = x * sx + 12;
    if (tx + tip.offsetWidth > rect.width) tx = x * sx - tip.offsetWidth - 12;
    tip.style.left = Math.max(tx, 4) + "px"; tip.style.top = "8px";
  };
  const hide = () => { tip.style.display = "none"; hv.innerHTML = ""; };
  svg.onpointermove = move; svg.onpointerdown = move;
  svg.onpointerleave = hide; svg.onpointercancel = hide;
}
init();
</script></body></html>
