# Rebuilds the per-stock pages (fmv/<ticker>/), sitemap.xml and robots.txt from public data, and commits them
# if anything changed. Runs after the US close on weekdays, and can be run by hand from the Actions tab.
name: Refresh stock pages
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: seo
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/seo_build.py
      - name: Commit changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard fmv sitemap.xml robots.txt)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "pear-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fmv sitemap.xml robots.txt
          git commit -m "Refresh stock pages"
          git push
